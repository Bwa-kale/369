<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>369 — Manifestation Ritual</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#000000;
  --panel:#0a0a0d;
  --panel-glass: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.08);
  --gold:#d4af37;
  --gold-dim: rgba(212,175,55,0.35);
  --violet:#8b5cf6;
  --violet-dim: rgba(139,92,246,0.35);
  --green:#39ff88;
  --green-dim: rgba(57,255,136,0.35);
  --emerald:#0a3d2e;
  --emerald-light:#1a6b4f;
  --emerald-glow: rgba(16,122,87,0.45);
  --text:#f4f1ea;
  --text-dim:#8a8a92;
  --text-faint:#4a4a52;
  --radius:18px;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body{
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}

#particles{
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  pointer-events:none;
  z-index:0;
}

.particle{
  position:absolute;
  border-radius:50%;
  opacity:0.5;
  animation: drift linear infinite;
}

@keyframes drift{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  10%{ opacity:0.6; }
  90%{ opacity:0.4; }
  100%{ transform:translateY(-110vh) translateX(20px); opacity:0; }
}

.wrap{
  position:relative;
  z-index:1;
  max-width:880px;
  margin:0 auto;
  padding:40px 20px 100px;
}

/* ---------- HEADER ---------- */
header{
  text-align:center;
  margin-bottom:44px;
}

.glyph{
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:15px;
  letter-spacing:0.5em;
  color:var(--text-faint);
  margin-bottom:14px;
}

h1{
  font-family:'Orbitron',sans-serif;
  font-weight:700;
  font-size:clamp(34px,6vw,52px);
  letter-spacing:0.04em;
  background:linear-gradient(120deg, var(--gold) 0%, #fff 50%, var(--violet) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

.subhead{
  font-family:'Space Mono',monospace;
  color:var(--text-dim);
  font-size:14px;
  letter-spacing:0.04em;
}

.sigil{
  margin:28px auto 6px;
  width:140px;
  display:block;
  filter: drop-shadow(0 0 18px var(--emerald-glow));
  animation: sigil-breathe 5s ease-in-out infinite;
}

@keyframes sigil-breathe{
  0%,100%{ filter: drop-shadow(0 0 14px var(--emerald-glow)); }
  50%{ filter: drop-shadow(0 0 26px var(--emerald-glow)); }
}

.sigil .tri-fill{
  fill: var(--emerald);
}

.sigil .tri-fill-inner{
  fill: var(--emerald-light);
  opacity:0.5;
}

.sigil .tri-outline{
  fill:none;
  stroke: var(--gold);
  stroke-width:1.6;
}

.sigil .tri-num{
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:21px;
  fill: var(--gold);
  text-anchor:middle;
}

/* ---------- ASCENT TRACK (signature element) ---------- */
.ascent{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:18px;
  margin:40px auto 36px;
  padding:0 10px;
  height:170px;
}

.step{
  position:relative;
  flex:1;
  max-width:220px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  cursor:pointer;
  transition: transform .25s ease;
}

.step:hover{ transform: translateY(-4px); }

.step .bar{
  width:100%;
  border-radius:14px 14px 0 0;
  background: var(--panel-glass);
  border:1px solid var(--border);
  border-bottom:none;
  position:relative;
  overflow:hidden;
  transition: box-shadow .3s ease, background .3s ease;
}

.step[data-session="morning"] .bar{ height:64px; }
.step[data-session="afternoon"] .bar{ height:104px; }
.step[data-session="night"] .bar{ height:146px; }

.step .fill{
  position:absolute;
  bottom:0; left:0; right:0;
  height:0%;
  transition: height .5s cubic-bezier(.2,.8,.2,1);
  opacity:0.9;
}

.step[data-session="morning"] .fill{ background:linear-gradient(180deg, var(--gold), transparent); box-shadow:0 0 24px var(--gold-dim); }
.step[data-session="afternoon"] .fill{ background:linear-gradient(180deg, var(--violet), transparent); box-shadow:0 0 24px var(--violet-dim); }
.step[data-session="night"] .fill{ background:linear-gradient(180deg, var(--green), transparent); box-shadow:0 0 24px var(--green-dim); }

.step.complete .bar{ background: rgba(255,255,255,0.05); }
.step.complete .fill{ height:100% !important; }

.step .num{
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:34px;
  position:absolute;
  top:10px; left:0; right:0;
  text-align:center;
  z-index:2;
  color:var(--text);
  text-shadow:0 2px 12px rgba(0,0,0,0.6);
}

.step .label{
  margin-top:12px;
  font-family:'Space Mono',monospace;
  font-size:12px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--text-dim);
}

.step .streak-tag{
  margin-top:4px;
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
}

.step[data-session="morning"].complete .streak-tag,
.step[data-session="morning"].complete .label{ color:var(--gold); }
.step[data-session="afternoon"].complete .streak-tag,
.step[data-session="afternoon"].complete .label{ color:var(--violet); }
.step[data-session="night"].complete .streak-tag,
.step[data-session="night"].complete .label{ color:var(--green); }

/* connecting baseline */
.ascent-base{
  height:2px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin-top:-2px;
}

/* ---------- INTENTION INPUT ---------- */
.card{
  background:var(--panel-glass);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  margin-bottom:28px;
  backdrop-filter: blur(14px);
}

.card-label{
  font-family:'Space Mono',monospace;
  font-size:12px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

textarea#affirmation{
  width:100%;
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:17px;
  padding:14px 16px;
  resize:none;
  min-height:56px;
  outline:none;
  transition:border-color .2s ease;
}

textarea#affirmation:focus{ border-color:var(--gold-dim); }

.lock-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--text-dim);
  font-family:'Space Mono',monospace;
  font-size:11px;
  padding:6px 12px;
  border-radius:20px;
  cursor:pointer;
  letter-spacing:0.05em;
  transition: all .2s ease;
}
.lock-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }
.lock-btn.locked{ color:var(--green); border-color:var(--green-dim); }

/* ---------- SESSION WRITER ---------- */
#writerSection{ display:none; }
#writerSection.active{ display:block; }

.session-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.session-title{
  font-family:'Orbitron',sans-serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:0.03em;
}

.session-progress{
  font-family:'Space Mono',monospace;
  font-size:14px;
  color:var(--text-dim);
}

.rep-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:18px;
}

.rep-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.rep-index{
  font-family:'Space Mono',monospace;
  font-size:13px;
  color:var(--text-faint);
  width:22px;
  text-align:right;
  flex-shrink:0;
}

.rep-row input{
  flex:1;
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:15px;
  padding:11px 14px;
  outline:none;
  transition: border-color .2s ease, background .2s ease;
}

.rep-row input:focus{ border-color: var(--session-color, var(--gold-dim)); }
.rep-row.done input{
  border-color: var(--session-color, var(--gold-dim));
  background: rgba(255,255,255,0.04);
}

.rep-row .check{
  width:20px; flex-shrink:0;
  text-align:center;
  color: var(--session-color, var(--gold));
  opacity:0;
  transition:opacity .2s ease;
  font-size:15px;
}
.rep-row.done .check{ opacity:1; }

.complete-btn{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:none;
  font-family:'Orbitron',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition: transform .15s ease, opacity .2s ease;
  opacity:0.35;
  pointer-events:none;
}
.complete-btn.ready{ opacity:1; pointer-events:auto; }
.complete-btn:active.ready{ transform:scale(0.98); }

/* ---------- STREAKS ---------- */
.streaks-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:28px;
}

.streak-card{
  background:var(--panel-glass);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 14px;
  text-align:center;
}

.streak-card .icon-dot{
  width:8px; height:8px; border-radius:50%;
  margin:0 auto 10px;
}
.streak-card[data-s="morning"] .icon-dot{ background:var(--gold); box-shadow:0 0 10px var(--gold-dim);}
.streak-card[data-s="afternoon"] .icon-dot{ background:var(--violet); box-shadow:0 0 10px var(--violet-dim);}
.streak-card[data-s="night"] .icon-dot{ background:var(--green); box-shadow:0 0 10px var(--green-dim);}

.streak-num{
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:28px;
}

.streak-cap{
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-top:4px;
}

/* ---------- CALENDAR / HISTORY ---------- */
.section-title{
  font-family:'Orbitron',sans-serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin: 36px 0 16px;
  display:flex;
  align-items:center;
  gap:12px;
}
.section-title::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}

.cal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.cal-nav{
  background:none;
  border:1px solid var(--border);
  color:var(--text-dim);
  width:32px; height:32px;
  border-radius:50%;
  cursor:pointer;
  font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.cal-nav:hover{ border-color:var(--gold-dim); color:var(--gold); }

.cal-month{
  font-family:'Space Mono',monospace;
  font-size:14px;
  letter-spacing:0.05em;
}

.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.cal-dow{
  text-align:center;
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--text-faint);
  padding-bottom:4px;
  text-transform:uppercase;
}

.cal-cell{
  aspect-ratio:1;
  border-radius:8px;
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  position:relative;
  cursor:pointer;
  transition: border-color .2s ease;
}
.cal-cell.empty{ border:none; cursor:default; }
.cal-cell.today{ border-color:var(--gold); }
.cal-cell:hover:not(.empty){ border-color: var(--text-dim); }

.cal-dots{
  display:flex;
  gap:2px;
  margin-top:3px;
}
.cal-dot{ width:4px; height:4px; border-radius:50%; background:var(--text-faint); opacity:0.25; }
.cal-dot.on.morning{ background:var(--gold); opacity:1; }
.cal-dot.on.afternoon{ background:var(--violet); opacity:1; }
.cal-dot.on.night{ background:var(--green); opacity:1; }

/* day detail modal */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}
.modal-overlay.active{ display:flex; }

.modal{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  max-width:480px;
  width:100%;
  max-height:80vh;
  overflow-y:auto;
  padding:26px;
}

.modal-close{
  float:right;
  background:none; border:none;
  color:var(--text-dim);
  font-size:20px;
  cursor:pointer;
  line-height:1;
}

.modal h3{
  font-family:'Orbitron',sans-serif;
  font-size:18px;
  margin-bottom:18px;
}

.modal-session{
  margin-bottom:16px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.modal-session:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0;}

.modal-session-label{
  font-family:'Space Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:8px;
}
.modal-session[data-s="morning"] .modal-session-label{ color:var(--gold); }
.modal-session[data-s="afternoon"] .modal-session-label{ color:var(--violet); }
.modal-session[data-s="night"] .modal-session-label{ color:var(--green); }

.modal-rep{
  font-size:13px;
  color:var(--text-dim);
  padding:4px 0;
  border-bottom:1px dashed rgba(255,255,255,0.04);
}
.modal-rep:last-child{ border-bottom:none; }
.modal-empty{
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:var(--text-faint);
}

/* ---------- FOOTER ---------- */
footer{
  text-align:center;
  margin-top:50px;
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  letter-spacing:0.05em;
}

@media (max-width:560px){
  .ascent{ gap:8px; height:140px; }
  .step .num{ font-size:24px; }
  .step .label{ font-size:10px; }
  .streaks-grid{ gap:8px; }
  .streak-num{ font-size:22px; }
}
</style>
</head>
<body>

<div id="particles"></div>

<div class="wrap">

  <header>
    <div class="glyph">3 · 6 · 9</div>
    <h1>Manifestation Ritual</h1>
    <div class="subhead">write it. believe it. let it compound.</div>

    <svg class="sigil" viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
      <polygon class="tri-fill" points="70,8 132,120 8,120" />
      <polygon class="tri-fill-inner" points="70,30 112,104 28,104" />
      <polygon class="tri-outline" points="70,8 132,120 8,120" />
      <text class="tri-num" x="70" y="34">3</text>
      <text class="tri-num" x="118" y="116">6</text>
      <text class="tri-num" x="22" y="116">9</text>
    </svg>
  </header>

  <!-- ASCENT TRACK -->
  <div class="ascent" id="ascent">
    <div class="step" data-session="morning">
      <div class="bar"><div class="fill"></div><div class="num">3</div></div>
      <div class="label">Morning</div>
      <div class="streak-tag" id="tag-morning">0 day streak</div>
    </div>
    <div class="step" data-session="afternoon">
      <div class="bar"><div class="fill"></div><div class="num">6</div></div>
      <div class="label">Afternoon</div>
      <div class="streak-tag" id="tag-afternoon">0 day streak</div>
    </div>
    <div class="step" data-session="night">
      <div class="bar"><div class="fill"></div><div class="num">9</div></div>
      <div class="label">Night</div>
      <div class="streak-tag" id="tag-night">0 day streak</div>
    </div>
  </div>
  <div class="ascent-base"></div>

  <!-- AFFIRMATION -->
  <div class="card">
    <div class="card-label">
      <span>Today's Intention</span>
      <button class="lock-btn" id="lockBtn">SET FOR TODAY</button>
    </div>
    <textarea id="affirmation" placeholder="I am... (write in present tense, as if it's already true)" rows="2"></textarea>
  </div>

  <!-- WRITER -->
  <div class="card" id="writerSection">
    <div class="session-banner">
      <div class="session-title" id="writerTitle">Morning · ×3</div>
      <div class="session-progress" id="writerProgress">0 / 3</div>
    </div>
    <div class="rep-list" id="repList"></div>
    <button class="complete-btn" id="completeBtn">Mark Session Complete</button>
  </div>

  <!-- STREAKS -->
  <div class="streaks-grid">
    <div class="streak-card" data-s="morning">
      <div class="icon-dot"></div>
      <div class="streak-num" id="streak-morning">0</div>
      <div class="streak-cap">Morning streak</div>
    </div>
    <div class="streak-card" data-s="afternoon">
      <div class="icon-dot"></div>
      <div class="streak-num" id="streak-afternoon">0</div>
      <div class="streak-cap">Afternoon streak</div>
    </div>
    <div class="streak-card" data-s="night">
      <div class="icon-dot"></div>
      <div class="streak-num" id="streak-night">0</div>
      <div class="streak-cap">Night streak</div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="section-title">History</div>
  <div class="card">
    <div class="cal-header">
      <button class="cal-nav" id="prevMonth">‹</button>
      <div class="cal-month" id="calMonthLabel">—</div>
      <button class="cal-nav" id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <footer>your words become your days — 🦂</footer>
</div>

<!-- DAY DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <h3 id="modalDate">—</h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
(function(){

  const SESSIONS = [
    {key:'morning', count:3, color:'var(--gold)'},
    {key:'afternoon', count:6, color:'var(--violet)'},
    {key:'night', count:9, color:'var(--green)'}
  ];

  const STORE_KEY = 'ritual369_data_v1';

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { days:{}, streaks:{morning:0,afternoon:0,night:0}, lastDone:{morning:null,afternoon:null,night:null} };
  }

  function saveData(){
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }

  let data = loadData();
  let activeSession = null;
  let calViewDate = new Date();

  // ---------- particles ----------
  function initParticles(){
    const container = document.getElementById('particles');
    const colors = ['#d4af37','#8b5cf6','#39ff88'];
    for(let i=0;i<26;i++){
      const p = document.createElement('div');
      p.className='particle';
      const size = Math.random()*3+1;
      p.style.width=size+'px';
      p.style.height=size+'px';
      p.style.left = Math.random()*100+'%';
      p.style.bottom = '-10px';
      p.style.background = colors[i%3];
      p.style.boxShadow = '0 0 6px '+colors[i%3];
      p.style.animationDuration = (Math.random()*20+18)+'s';
      p.style.animationDelay = (Math.random()*20)+'s';
      container.appendChild(p);
    }
  }

  // ---------- day helpers ----------
  function getDay(dateStr){
    if(!data.days[dateStr]){
      data.days[dateStr] = { affirmation:'', sessions:{ morning:null, afternoon:null, night:null } };
    }
    return data.days[dateStr];
  }

  function isSessionDone(dateStr, sessionKey){
    const day = data.days[dateStr];
    return !!(day && day.sessions[sessionKey] && day.sessions[sessionKey].length > 0);
  }

  // ---------- streak calc ----------
  function recalcStreak(sessionKey){
    let streak = 0;
    let d = new Date();
    // if today not done yet, start checking from yesterday so an incomplete today doesn't zero out an active streak
    const tStr = todayStr();
    let cursor = new Date(d);
    if(!isSessionDone(tStr, sessionKey)){
      cursor.setDate(cursor.getDate()-1);
    }
    while(true){
      const ds = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');
      if(isSessionDone(ds, sessionKey)){
        streak++;
        cursor.setDate(cursor.getDate()-1);
      } else {
        break;
      }
    }
    return streak;
  }

  function updateAllStreaks(){
    SESSIONS.forEach(s=>{
      const val = recalcStreak(s.key);
      document.getElementById('streak-'+s.key).textContent = val;
      document.getElementById('tag-'+s.key).textContent = val + (val===1?' day streak':' day streak');
    });
  }

  // ---------- affirmation lock ----------
  const lockBtn = document.getElementById('lockBtn');
  const affInput = document.getElementById('affirmation');

  function loadAffirmation(){
    const day = getDay(todayStr());
    if(day.affirmation){
      affInput.value = day.affirmation;
      lockBtn.classList.add('locked');
      lockBtn.textContent = 'LOCKED ✓';
    }
  }

  lockBtn.addEventListener('click', ()=>{
    const val = affInput.value.trim();
    if(!val) return;
    const day = getDay(todayStr());
    day.affirmation = val;
    saveData();
    lockBtn.classList.add('locked');
    lockBtn.textContent = 'LOCKED ✓';
  });

  affInput.addEventListener('input', ()=>{
    if(lockBtn.classList.contains('locked')){
      lockBtn.classList.remove('locked');
      lockBtn.textContent = 'SET FOR TODAY';
    }
  });

  // ---------- ascent track click -> open writer ----------
  document.querySelectorAll('.step').forEach(step=>{
    step.addEventListener('click', ()=>{
      openWriter(step.dataset.session);
    });
  });

  const writerSection = document.getElementById('writerSection');
  const writerTitle = document.getElementById('writerTitle');
  const writerProgress = document.getElementById('writerProgress');
  const repList = document.getElementById('repList');
  const completeBtn = document.getElementById('completeBtn');

  function sessionMeta(key){ return SESSIONS.find(s=>s.key===key); }

  function openWriter(sessionKey){
    activeSession = sessionKey;
    const meta = sessionMeta(sessionKey);
    const day = getDay(todayStr());
    const existing = day.sessions[sessionKey] || [];

    writerSection.classList.add('active');
    writerSection.style.setProperty('--session-color', meta.color);
    writerTitle.textContent = sessionKey.charAt(0).toUpperCase()+sessionKey.slice(1) + ' · ×' + meta.count;

    repList.innerHTML = '';
    for(let i=0;i<meta.count;i++){
      const row = document.createElement('div');
      row.className = 'rep-row';
      row.style.setProperty('--session-color', meta.color);
      const val = existing[i] || '';
      if(val) row.classList.add('done');
      row.innerHTML = `
        <div class="rep-index">${i+1}</div>
        <input type="text" data-idx="${i}" value="${val.replace(/"/g,'&quot;')}" placeholder="${day.affirmation ? day.affirmation : 'Write your affirmation...'}" />
        <div class="check">✓</div>
      `;
      repList.appendChild(row);
    }

    repList.querySelectorAll('input').forEach((inp, idx)=>{
      inp.addEventListener('input', ()=>{
        const row = inp.closest('.rep-row');
        if(inp.value.trim().length>0){ row.classList.add('done'); }
        else { row.classList.remove('done'); }
        updateProgress();
      });
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const next = repList.querySelector(`input[data-idx="${idx+1}"]`);
          if(next) next.focus();
        }
      });
    });

    updateProgress();
    writerSection.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(()=>{ const first = repList.querySelector('input'); if(first && !first.value) first.focus(); }, 300);
  }

  function updateProgress(){
    const meta = sessionMeta(activeSession);
    const filled = repList.querySelectorAll('.rep-row.done').length;
    writerProgress.textContent = filled + ' / ' + meta.count;
    if(filled === meta.count){
      completeBtn.classList.add('ready');
    } else {
      completeBtn.classList.remove('ready');
    }
  }

  completeBtn.addEventListener('click', ()=>{
    if(!completeBtn.classList.contains('ready')) return;
    const day = getDay(todayStr());
    const values = Array.from(repList.querySelectorAll('input')).map(i=>i.value.trim());
    day.sessions[activeSession] = values;
    saveData();
    renderAscent();
    updateAllStreaks();
    renderCalendar();
    writerSection.classList.remove('active');
  });

  // ---------- ascent visual state ----------
  function renderAscent(){
    const day = getDay(todayStr());
    SESSIONS.forEach(s=>{
      const stepEl = document.querySelector(`.step[data-session="${s.key}"]`);
      const done = day.sessions[s.key] && day.sessions[s.key].length === s.count;
      stepEl.classList.toggle('complete', !!done);
      const fill = stepEl.querySelector('.fill');
      if(done){
        fill.style.height = '100%';
      } else if(day.sessions[s.key]){
        fill.style.height = Math.round((day.sessions[s.key].length / s.count)*100) + '%';
      } else {
        fill.style.height = '0%';
      }
    });
  }

  // ---------- calendar ----------
  const calGrid = document.getElementById('calGrid');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const DOW = ['S','M','T','W','T','F','S'];
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function renderCalendar(){
    calGrid.innerHTML = '';
    DOW.forEach(d=>{
      const el = document.createElement('div');
      el.className='cal-dow';
      el.textContent = d;
      calGrid.appendChild(el);
    });

    const year = calViewDate.getFullYear();
    const month = calViewDate.getMonth();
    calMonthLabel.textContent = MONTH_NAMES[month] + ' ' + year;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const tStr = todayStr();

    for(let i=0;i<firstDay;i++){
      const el = document.createElement('div');
      el.className='cal-cell empty';
      calGrid.appendChild(el);
    }

    for(let d=1; d<=daysInMonth; d++){
      const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (ds===tStr ? ' today' : '');
      const dots = SESSIONS.map(s=>{
        const done = isSessionDone(ds, s.key);
        return `<div class="cal-dot ${done?'on '+s.key:''}"></div>`;
      }).join('');
      cell.innerHTML = `<div>${d}</div><div class="cal-dots">${dots}</div>`;
      cell.addEventListener('click', ()=> openDayModal(ds));
      calGrid.appendChild(cell);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    calViewDate.setMonth(calViewDate.getMonth()-1);
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    calViewDate.setMonth(calViewDate.getMonth()+1);
    renderCalendar();
  });

  // ---------- day modal ----------
  const modalOverlay = document.getElementById('modalOverlay');
  const modalDate = document.getElementById('modalDate');
  const modalBody = document.getElementById('modalBody');

  function openDayModal(dateStr){
    const day = data.days[dateStr];
    const dObj = new Date(dateStr+'T00:00:00');
    modalDate.textContent = dObj.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});

    if(!day || (!day.affirmation && SESSIONS.every(s=>!day.sessions[s.key]))){
      modalBody.innerHTML = '<div class="modal-empty">No entries this day.</div>';
    } else {
      let html = '';
      if(day.affirmation){
        html += `<div style="margin-bottom:16px; font-family:'Space Mono',monospace; font-size:12px; color:var(--text-dim);">Intention: <span style="color:var(--text)">${escapeHtml(day.affirmation)}</span></div>`;
      }
      SESSIONS.forEach(s=>{
        const entries = day.sessions[s.key];
        html += `<div class="modal-session" data-s="${s.key}">
          <div class="modal-session-label">${s.key} · ${entries ? entries.length : 0}/${s.count}</div>`;
        if(entries && entries.length){
          entries.forEach((e,i)=>{
            html += `<div class="modal-rep">${i+1}. ${escapeHtml(e)}</div>`;
          });
        } else {
          html += `<div class="modal-empty">Not done</div>`;
        }
        html += `</div>`;
      });
      modalBody.innerHTML = html;
    }
    modalOverlay.classList.add('active');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('modalClose').addEventListener('click', ()=>{
    modalOverlay.classList.remove('active');
  });
  modalOverlay.addEventListener('click', (e)=>{
    if(e.target === modalOverlay) modalOverlay.classList.remove('active');
  });

  // ---------- init ----------
  initParticles();
  loadAffirmation();
  renderAscent();
  updateAllStreaks();
  renderCalendar();

})();
</script>

</body>
</html>
